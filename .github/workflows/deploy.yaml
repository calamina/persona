name: CI/CD Pipeline Gatekeeper

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Workspace Dependencies
        run: bun install --frozen-lockfile

      - name: Run Workspace Linters & Typechecks
        run: bun lint

  deploy:
    needs: lint-and-validate
    if: github.event_name == 'push' && success()
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Production Build on Dokploy
        run: |
          curl -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}"
